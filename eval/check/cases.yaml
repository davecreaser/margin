# Continuity-check eval: invented chapters (chapters/) checked against the Ask eval copy of
# the demo novel (eval/ask/counterfactual.yaml applied). Every phrase below appears in its
# chapter; a finding matches a planted item when its chapter quote or claim contains the
# phrase. Values in comments are what the eval copy establishes.

- id: market-day
  file: 01-market-day.md
  kind: ordinary
  contradictions:
    - {phrase: "aged twelve", gold: [6]}             # aged nine
    - {phrase: "twenty pounds", gold: [6]}           # cost ten pounds
    - {phrase: "five guineas", gold: [6]}            # harness three guineas
  consistent:
    - {phrase: "cost him ten pounds", gold: [6]}      # the victoria
    - {phrase: "wash flannel", gold: [1]}
  new:
    - {phrase: "Gaffer"}
    - {phrase: "Pidduck"}

