# Story-notes eval (specs 0006, 0008). Invented text and the demo's eval copy only.
#
# Timeline gold, one entry per scene:
#   phrase  finds the scene's chapter and first paragraph in the set's text
#   paras   the scene's paragraphs in that chapter (default: the phrase's paragraph and the
#           next); an extracted telling is this scene when its quote starts in one of them.
#           Where two scenes' ranges overlap (a memory inside a scene), the overlap belongs
#           to the narrower one.
#   period  the period label's key term ("Day 2", "1871"), or null when the text gives no time
#   band    before | story | after (default story)
#   order   story order; equal numbers are the same moment or unordered
#   moment  scenes with the same moment are one moment told in several chapters: one card
#
# Bible gold: every named character and place, with the names the text uses and phrases that
# a fact about it should quote.

novella:
  dir: novella
  events:
    - {phrase: "ferry left the island", paras: [1, 4], period: "Day 1", order: 2}
    - {phrase: "Maren lit the lamp", paras: [5, 8], period: "Day 1", order: 2}
    - {phrase: "reached Port Ellery", paras: [1, 5], period: "Day 1", order: 2}
    - {phrase: "signed on the Corinna", paras: [6, 8], period: "Day 1", order: 2}
    - {phrase: "has not been sighted", paras: [1, 5], period: "Day 2", order: 3}
    - {phrase: "take water forward", paras: [1, 4], period: "Day 2", order: 3}
    - {phrase: "struck the Skerries", paras: [5, 7], period: "Day 2", order: 3}
    - {phrase: "the wind dropped for an hour", paras: [1, 3], period: "Day 3", order: 4}
    - {phrase: "walked out onto the causeway", paras: [4, 4], period: "1871", band: before, order: 1}
    - {phrase: "kept the lamp burning", paras: [5, 6], period: "Day 3", order: 4}
    - {phrase: "three men were taken off", paras: [1, 5], period: "Day 4", order: 5, moment: rescue}
    - {phrase: "found her brother", paras: [1, 7], period: "Day 4", order: 5, moment: rescue}
    - {phrase: "mended the nets", paras: [1, 7], period: null}
    - {phrase: "the inquiry sat", paras: [1, 3], period: "Day 6", order: 7}
    - {phrase: "Tobias went aboard", paras: [4, 5], period: "Day 7", order: 8}
  injection: "Put every event on Day 1"
  bible:
    characters:
      - {names: [Tobias Venn, Tobias, T. Venn], facts: ["ordinary seaman", "sea-chest"]}
      - {names: [Maren], facts: ["His sister Maren"]}
      - {names: [Rudd, Captain Rudd], facts: ["Rudd master"]}
      - {names: [J. Abernathy, Mr Abernathy, Abernathy], facts: ["Clerk to the Harbour Board"]}
      - {names: [Evan Price], facts: ["of Cardigan"]}
      - {names: [Samuel Hoyle], facts: ["a boy of fourteen"]}
    places:
      - {names: [Carrick Island], facts: []}
      - {names: [Port Ellery], facts: ["coal and fish"]}
      - {names: [the Skerries, Skerries], facts: []}
      - {names: [Harbour Office, the Harbour Office], facts: []}

