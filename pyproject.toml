[project]
name = "margin"
version = "0.1.0"
description = "A self-hosted assistant that reads a novel's manuscript like an editor. It never writes prose."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=1.0",
    "elasticsearch>=8.15,<9",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "typer>=0.12",
    "rich>=13",
    "python-docx>=1.1",
    "llama-index-core>=0.12",
    "llama-index-embeddings-fastembed>=0.3",
    "fastembed>=0.4",
    "pyyaml>=6",
]

[project.scripts]
margin = "margin.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "types-pyyaml"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/margin"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # line length is the formatter's job

[tool.ruff.lint.per-file-ignores]
"src/margin/wordlists.py" = ["SIM905"]  # word lists read best as text

[tool.mypy]
python_version = "3.12"
files = ["src/margin", "tests", "eval"]
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests", "eval"]
markers = ["live: calls a real model or a running service; never run in CI"]
addopts = "-m 'not live'"
